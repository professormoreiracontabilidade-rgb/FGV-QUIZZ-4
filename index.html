kground:#fff;color:var(--navy);border:2px solid #9bb1c8}.subtle{background:#eef3f8;color:var(--navy);border:2px solid #d1deeb}.danger{background:#fff;color:#ad2f36;border:2px solid #e7b6b6}.primary:disabled,.outline:disabled,.subtle:disabled{opacity:.43;cursor:not-allowed}.big-btn{width:100%;max-width:540px}.minibtn{border:0;background:transparent;color:#365470;padding:7px;text-decoration:underline;font-size:.84em;font-weight:650}.questiontop{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:.84em;font-weight:800;margin:12px 0 6px}.bar{height:12px;background:#d6e2ec;border-radius:14px;overflow:hidden;margin-bottom:17px}.bar>div{height:100%;background:linear-gradient(90deg,#f3bc48,#f7db8c);border-radius:inherit;transition:width .25s}.topic{display:inline-block;border-radius:20px;background:#e7eef7;color:#214a76;font-weight:800;font-size:.85em;padding:5px 12px;margin:3px 0 11px}.qtitle{font-size:clamp(22px,5.8vw,29px);line-height:1.42;margin:4px 0 18px;font-weight:750;white-space:pre-wrap}.answers{display:grid;gap:11px}.opt{display:flex;align-items:flex-start;gap:13px;border:2px solid #d9e4ec;padding:14px 13px;background:white;border-radius:14px;width:100%;text-align:left;line-height:1.46;font-size:1.04em;color:var(--ink)}.opt:not([disabled]):hover{border-color:#6a97c0;background:#f7faff}.opt.selected{border-color:var(--blue);background:#ecf4ff}.opt .letter{width:40px;height:40px;border-radius:10px;flex:0 0 40px;display:inline-grid;place-items:center;background:#e5edf6;color:#163960;font-weight:900}.opt.right{background:#e3f7e9;border-color:#238b5f}.opt.right .letter{background:#187b52;color:white}.opt.wrong{background:#ffe8e8;border-color:#ce4b51}.opt.wrong .letter{background:#bb3e45;color:white}.opt[disabled]{cursor:default;opacity:1}.tools{display:flex;gap:11px;align-items:center;margin-top:18px;flex-wrap:wrap}.tools .primary{flex:1}.tip{font-size:.82em;color:var(--muted);margin-top:10px}.feedback{margin-top:23px;border-radius:15px;overflow:hidden;border:1px solid #b8d9c7;background:#f6fff9;scroll-margin-top:12px}.feedback.fail{background:#fffaf9;border-color:#ecc3c5}.feedback .fhead{padding:13px 16px;background:#d7f2df;display:flex;align-items:center;gap:11px;font-weight:900;color:#116540;font-size:1.06em}.feedback.fail .fhead{background:#ffe6e6;color:#a83136}.status-icon{font-size:1.3em}.fbcontent{padding:15px 17px 19px}.fbcontent h3{font-size:1em;color:var(--navy);margin:13px 0 4px}.fbcontent p{margin:0 0 13px;white-space:pre-line}.gabarito{border-left:5px solid var(--gold);padding:10px 13px;margin:10px 0 17px;background:#fff8e8;border-radius:3px 10px 10px 3px;font-weight:850}.sourcehint{border:1px solid #e4d4ad;background:#fffaf0;border-radius:9px;margin-top:12px;padding:10px 13px;font-size:.87em;color:#705421}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));background:#fbfcffed;backdrop-filter:blur(14px);border-top:1px solid #ccd8e4;box-shadow:0 -5px 25px #0924431a}.navin{max-width:830px;margin:auto;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.nav .primary,.nav .outline,.nav .subtle{min-height:52px;font-size:.95em;padding:9px 8px}.nav .subtle{padding:9px 13px}.flash{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .15s;background:radial-gradient(circle at 50% 45%,#23e58574,#009b4a23 60%,#08854318);box-shadow:inset 0 0 0 14px #21bd5b88}.flash.error{background:radial-gradient(circle at 50% 45%,#fb32328a,#d92c2c24 60%,#b92a2a1c);box-shadow:inset 0 0 0 14px #d7323299}.flash.show{opacity:1}.flash .flashmsg{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#087449;color:#fff;box-shadow:0 5px 20px #10101033;border-radius:40px;padding:11px 25px;font-size:1.25em;font-weight:950;text-align:center;white-space:nowrap}.flash.error .flashmsg{background:#b92932}.results h2{font-size:2em;text-align:center;margin:14px 0}.score{font-size:clamp(55px,13vw,87px);color:var(--navy);text-align:center;line-height:1.2;font-weight:900}.scoresub{text-align:center;color:#53708c;margin:2px 0 22px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.metric{background:#f4f8fc;border-radius:13px;text-align:center;padding:14px 8px}.metric strong{font-size:1.4em;display:block}.metric span{font-size:.75em;color:var(--muted);font-weight:750}.review{display:grid;gap:8px;margin-top:18px}.review button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;padding:12px;border-radius:11px;color:var(--ink);text-align:left}.rmark{font-weight:900}.rmark.ok{color:#0d8757}.rmark.bad{color:#b63a3b}.rmark.skip{color:#667d90}.small{font-size:.85em;color:var(--muted)}.lightlabel{color:#ffd686;font-weight:900}.result-actions{display:grid;gap:10px;margin:18px 0 8px}

<script>
'use strict';
const QUIZ_NUM=4, DATA=[{"original":4,"topic":"CONCEITOS BÁSICOS DA CONTABILIDADE","prompt":"A referência à riqueza líquida de uma entidade pode ser associada:","options":["à sua capacidade de liquidez imediata;","ao montante de ativos realizáveis no exercício financeiro;","aos valores liquidados com capital próprio;","ao montante dos ativos deduzido dos passivos;","ao capital social liquidado pelos proprietários."],"answer":"D","why":"A riqueza líquida equivale ao patrimônio líquido: ativos menos passivos. O indicador mede a participação residual dos proprietários nos recursos da entidade.","others":"Liquidez imediata trata da disponibilidade de caixa; ativos realizáveis são apenas parte do ativo; capital social, valores aportados ou liquidados pelos sócios não equivalem necessariamente ao PL total."},{"original":9,"topic":"FATOS CONTÁBEIS","prompt":"Em novembro de 2024, os saldos do ativo, do passivo e do patrimônio líquido de uma sociedade empresária permaneceram iguais. O seguinte fato pode ter acontecido no referido mês:","options":["pagamento dos salários do mês.","pagamento de empréstimo bancário.","pagamento de dividendos de 2023 aos sócios.","reconhecimento de provisão para contingências.","transferências de valores de Outros Resultados Abrangentes para o resultado do exercício."],"answer":"E","why":"Uma transferência entre Outros Resultados Abrangentes e resultado ou saldos internos do patrimônio líquido pode conservar os totais dos grupos patrimoniais apresentados, embora altere a composição.","others":"Pagamento de salários, empréstimo ou dividendos altera caixa ou obrigações; constituição de provisão aumenta passivo e diminui PL. Esses fatos modificam ao menos algum saldo total citado."},{"original":14,"topic":"ESCRITURAÇÃO E PARTIDAS DOBRADAS","prompt":"Considere que uma rede de farmácias localizada em Manaus adquiriu R$50.000,00 em testes rápidos para Covid-19, realizando o pagamento integral no momento da compra. É correto afirmar que o lançamento a ser contabilizado na situação apresentada é de","options":["primeira fórmula.","segunda fórmula.","terceira fórmula.","quarta fórmula.","quinta fórmula."],"answer":"A","why":"A compra integralmente à vista envolve uma conta debitada (Estoques ou despesa conforme destinação) e outra creditada (Caixa). É lançamento de primeira fórmula: um débito e um crédito.","others":"A segunda fórmula tem um débito e vários créditos; a terceira, vários débitos e um crédito; a quarta, vários débitos e créditos. A quinta não integra a classificação clássica."},{"original":19,"topic":"BALANÇO PATRIMONIAL","prompt":"No balanço patrimonial de uma empresa devem ser considerados diversos tipos de bens. As máquinas industriais utilizadas nos processos produtivos são exemplos de bens","options":["de investimento.","imobilizados.","de venda.","de renda.","intangíveis."],"answer":"B","why":"Máquinas industriais empregadas na produção por mais de um período são bens corpóreos usados na operação, classificados no Imobilizado.","others":"Não são ativos destinados à revenda nem imóveis para renda; investimento possui outra finalidade, e intangível pressupõe ausência de substância física."},{"original":24,"topic":"ESTRUTURA CONCEITUAL (CPC 00)","prompt":"De acordo com a NBC TG Estrutura Conceitual- Estrutura Conceitual para Relatório Financeiro, as decisões sobre o reconhecimento dos ativos e dos passivos no balanço patrimonial são restringidas","options":["pelo tempo.","pelo custo.","pelo uso de estimativas.","pelo julgamento da administração.","pela complexidade das transações."],"answer":"B","why":"O reconhecimento de ativos e passivos deve considerar a restrição do custo da informação: seus benefícios para usuários devem justificar custos de produzir e utilizar informações.","others":"Tempo, estimativas, julgamento e complexidade podem influenciar a produção da informação, mas não são a restrição geral destacada no gabarito da Estrutura Conceitual."},{"original":29,"topic":"DEMONSTRAÇÃO DO RESULTADO (DRE)","prompt":"Na demonstração do resultado do exercício de uma entidade, as despesas operacionais incluem despesas de vendas e despesas administrativas. Assinale a opção que indica uma despesa administrativa.","options":["Propaganda e publicidade.","Honorários da auditoria externa.","Perdas estimadas com crédito de liquidação duvidosa.","Com juros.","Com comissões."],"answer":"B","why":"Honorários de auditoria externa são gastos de administração e fiscalização geral da entidade, tipicamente classificados como despesa administrativa.","others":"Propaganda, PECLD ligada a vendas e comissões relacionam-se à comercialização; juros são despesas financeiras e não administrativas."},{"original":34,"topic":"REGIME DE COMPETÊNCIA E CAIXA","prompt":"Assinale a opção que indica um fato em que o reconhecimento contábil da despesa pelo Regime de Competência acontece antes do reconhecimento pelo Regime de Caixa.","options":["Pagamento, em janeiro, de um ano de despesas de aluguel antecipadas.","Pagamento, em fevereiro, do salário de janeiro de seus funcionários.","Pagamento, em março, da compra de um veículo realizada em fevereiro.","Pagamento, em março, da distribuição de lucros do ano anterior aos sócios.","Pagamento, em abril, de passagem aérea de viagem que irá acontecer em maio."],"answer":"B","why":"Salário referente a janeiro é despesa por competência em janeiro, ainda que o dinheiro só saia em fevereiro; a despesa antecede o pagamento.","others":"Aluguel antecipado e passagem para viagem futura são pagos antes da despesa; compra de veículo é aquisição de ativo, não despesa imediata; distribuição de lucros não é despesa operacional."},{"original":39,"topic":"ESTOQUES (CPC 16)","prompt":"O custo dos estoques de bens ou serviços produzidos e segregados para projetos específicos deve ser atribuído pelo uso","options":["do custo médio ponderado fixo.","do custo médio ponderado móvel.","do último que entra, primeiro que sai.","do primeiro que entra, primeiro que sai.","da identificação específica dos custos individuais."],"answer":"E","why":"Estoques segregados para projetos específicos usam identificação específica: cada unidade ou serviço mantém seu custo individual.","others":"PEPS e médias são fórmulas para itens normalmente intercambiáveis; UEPS não é admitido pelo CPC 16. Nenhuma fórmula genérica substitui a identificação de custos individualizados nesses casos."},{"original":44,"topic":"PEPS E CUSTO MÉDIO","prompt":"Uma empresa comercial registra e avalia seus estoques de mercadorias pelo inventário permanente. Ao final de um determinado mês, havia 10 unidades de mercadorias ao custo unitário de R$ 8,00. No dia 02 do mês seguinte, a empresa adquiriu 5 unidades de mercadorias ao custo unitário de R$ 10,00. No dia 05, vendeu 12 unidades pelo valor de R$ 15,00 cada uma. Com base nessas informações, o custo das mercadorias vendidas de acordo com o método PEPS é:","options":["R$ 100,00;","R$ 104,00;","R$ 106,00;","R$ 150,00;","R$ 180,00."],"answer":"A","why":"Pelo PEPS, vendem-se primeiro 10 unidades a R$ 8 = R$ 80 e depois 2 unidades a R$ 10 = R$ 20. CMV total = R$ 100.","others":"R$ 104 e R$ 106 não correspondem à baixa por lotes; R$ 150 e R$ 180 confundem preço de venda ou total de receita com custo das mercadorias vendidas."},{"original":49,"topic":"ATIVO IMOBILIZADO (CPC 27)","prompt":"Uma empresa de petróleo mantém uma plataforma em outra cidade. Essa empresa compra alguns imóveis perto da plataforma e os aluga para seus funcionários. Esses imóveis são classificados no grupo de ativos","options":["investimento.","circulante.","realizável a Longo Prazo.","imobilizado.","intangível."],"answer":"D","why":"Imóveis próximos à plataforma e alugados a funcionários atendem à atividade operacional da empresa de petróleo; o enunciado e o gabarito classificam-nos como imobilizado.","others":"Investimento é o grupo para imóveis mantidos primordialmente por renda/valorização; ativos circulantes, realizáveis a longo prazo e intangíveis não se ajustam ao uso funcional descrito."},{"original":54,"topic":"DEPRECIAÇÃO E AMORTIZAÇÃO","prompt":"De acordo com o Pronunciamento Técnico CPC 27 – Ativo Imobilizado, a depreciação de uma ativo imobilizado não será reconhecida se","options":["o ativo não foi utilizado no exercício.","o ativo sofreu manutenção e/ou reparação.","o valor justo é maior do que o valor contábil.","o valor residual é maior do que o valor contábil.","o ativo é mantido como reserva para utilização, quando necessário."],"answer":"D","why":"Quando o valor residual estimado é maior do que o valor contábil, não resta base depreciável positiva. A despesa de depreciação fica zero enquanto essa condição persistir.","others":"Falta de uso, manutenção, valor justo maior e disponibilidade como reserva não interrompem automaticamente a depreciação de um bem disponível para uso."},{"original":59,"topic":"ATIVO INTANGÍVEL (CPC 04)","prompt":"De acordo com o Pronunciamento Técnico CPC 04 (R1)- Ativo Intangível, pode-se diferenciar o ativo intangível e o ágio derivado da expectativa de rentabilidade futura (goodwill) do seguinte modo:","options":["o ativo intangível é identificável.","o ativo intangível é mensurável com objetividade.","o ativo intangível deve ser amortizado.","o goodwill é avaliado anualmente pelo valor de mercado.","o goodwill pode ser reavaliado."],"answer":"A","why":"Ativo intangível é identificável — separável ou decorrente de direitos contratuais/legais. Goodwill representa benefícios econômicos futuros não identificáveis individualmente.","others":"Intangível nem sempre tem mensuração “objetiva” simples; não é necessariamente amortizado se vida indefinida; goodwill não é simplesmente ajustado a mercado e não é objeto de reavaliação livre."},{"original":64,"topic":"IMPAIRMENT (CPC 01)","prompt":"Em 01/01/2023, uma sociedade empresária adquiriu um terreno para usar em sua atividade fim por R$120.000. Em 31/12/2023, ela constatou que o valor justo líquido de despesas de venda do terreno era de R$100.000. Já o valor em uso era estimado em R$90.000. Na data, deve-se reconhecer, na Demonstração do Resultado do Exercício da sociedade empresária, uma","options":["despesa financeira de R$20.000.","despesa financeira de R$30.000.","perda por desvalorização do ativo de R$10.000.","perda por desvalorização do ativo de R$20.000.","perda por desvalorização do ativo de R$30.000."],"answer":"D","why":"O recuperável é o maior entre R$ 100.000 (justo líquido) e R$ 90.000 (uso), portanto R$ 100.000. Como o terreno está registrado por R$ 120.000, a perda reconhecida é R$ 20.000 no resultado.","others":"Não é despesa financeira; a perda de R$ 10.000 considera diferença entre os dois valores de avaliação, e R$ 30.000 usa o valor em uso menor, em vez do maior recuperável."},{"original":69,"topic":"CLIENTES E PECLD","prompt":"Em 31/12/X0, uma sociedade empresária tinha a receber de seus clientes R$100.000 em até cinco meses. A inadimplência era estimada em 4%. Assinale a opção que indica a apresentação do fato nas demonstrações contábeis da sociedade empresária.","options":["R$96.000 no ativo circulante e R$4.000 no passivo circulante, no balanço patrimonial.","R$100.000 no ativo circulante e R$4.000 no passivo circulante, no balanço patrimonial.","R$96.000 no ativo circulante, no balanço patrimonial, e evidenciação de R$4.000, em nota explicativa.","R$100.000 no ativo circulante, no balanço patrimonial, e evidenciação de R$4.000, em nota explicativa.","R$96.000 no ativo circulante e R$4.000 em conta redutora do ativo circulante, no balanço patrimonial."],"answer":"C","why":"A inadimplência esperada é de 4% × R$ 100.000 = R$ 4.000; o valor líquido de clientes no ativo é R$ 96.000. O gabarito da coletânea indica C.","others":"A e B classificam a PECLD como passivo, incorretamente; D mostra clientes sem deduzir a perda. Atenção: a alternativa E descreve explicitamente a conta retificadora no ativo, que é o tratamento contábil usual; C e E ficam muito próximas e esta questão merece conferência antes de avaliação valendo nota."},{"original":74,"topic":"DESPESAS ANTECIPADAS","prompt":"Em 30/07/2017, uma entidade pagou aluguel antecipado por três anos, a partir de agosto de 2017, no valor total de R$ 144.000. Assinale a opção que indica a contabilização da despesa antecipada com aluguel no Balanço Patrimonial da entidade, em 31/12/2017.","options":["R$ 48.000 no Ativo Circulante e R$ 28.000 no Ativo Realizável a Longo Prazo.","R$ 48.000 no Ativo Circulante e R$ 76.000 no Ativo Realizável a Longo Prazo.","R$ 48.000 no Ativo Circulante e R$ 96.000 no Ativo Realizável a Longo Prazo.","R$ 68.000 no Ativo Circulante e R$ 56.000 no Ativo Realizável a Longo Prazo.","R$ 68.000 no Ativo Circulante e R$ 76.000 no Ativo Realizável a Longo Prazo."],"answer":"B","why":"Aluguel mensal = R$ 144.000/36 = R$ 4.000. De agosto a dezembro foram 5 meses (R$ 20.000 de despesa); restam R$ 124.000, com R$ 48.000 nos próximos 12 meses (AC) e R$ 76.000 no longo prazo.","others":"A, C, D e E apresentam combinações que não somam corretamente o saldo remanescente ou não respeitam os 12 meses seguintes."},{"original":79,"topic":"PROVISÕES E CONTINGÊNCIAS","prompt":"Uma entidade concede prazos de garantias aos diferentes produtos que vende e provisiona as despesas com garantias pela melhor estimativa, tendo em vista o histórico de cada produto. O tratamento dos valores relacionados a garantias de produtos diferentes como uma classe única de provisão pode ser:","options":["apropriado;","compensável;","inapropriado;","recomendável;","excluído pela entidade."],"answer":"A","why":"É admissível agrupar obrigações semelhantes de garantia em uma classe de provisão, desde que a apresentação agregada seja apropriada e relevante.","others":"O termo “compensável” não autoriza compensar obrigações e ativos; “inapropriado”, “recomendável” como regra absoluta e “excluído” não refletem a possibilidade de agrupamento conforme características das obrigações."},{"original":84,"topic":"DEMONSTRAÇÃO DOS FLUXOS DE CAIXA","prompt":"Ao elaborar a Demonstração dos Fluxos de Caixa de uma empresa, os fluxos de caixa agregados advindos da obtenção ou da perda de controle de controladas ou outros negócios, devem ser apresentados separadamente e classificados como","options":["atividades operacionais.","atividades de investimento.","atividades de financiamento.","equivalentes de caixa.","ajustes ao resultado líquido."],"answer":"B","why":"Obtenção ou perda de controle de controlada ou outro negócio corresponde a decisão de investimento; a DFC apresenta os fluxos agregados separadamente em atividades de investimento.","others":"Operacionais dizem respeito à atividade principal, financiamento altera estrutura de capital; equivalentes de caixa e ajustes ao lucro não classificam essa transação de aquisição ou alienação de controle."},{"original":89,"topic":"DEMONSTRAÇÃO DO VALOR ADICIONADO","prompt":"Na elaboração da Demonstração do Valor Adicionado, são incluídos em “Insumos Adquiridos de Terceiros” e considerados para a obtenção do Valor Adicionado Bruto:","options":["créditos de liquidação duvidosa.","depreciação, amortização e exaustão.","perda e recuperação de valores ativos.","resultado de equivalência patrimonial.","receita relativa à construção de ativos próprios."],"answer":"C","why":"Perda e recuperação de valores de ativos podem ser consideradas entre insumos adquiridos de terceiros no modelo de DVA utilizado pela questão, afetando a obtenção do valor adicionado bruto.","others":"Depreciação/amortização/exaustão são tratadas separadamente após valor adicionado bruto; equivalência patrimonial é transferência; construção própria integra produção; a alternativa A não é a rubrica selecionada pelo gabarito."},{"original":94,"topic":"RESERVAS DE LUCROS","prompt":"Assinale a opção que indica a reserva constituída no patrimônio líquido de uma sociedade empresária com o objetivo de segregar uma parcela de lucros, correspondente a prováveis perdas extraordinárias futuras, que deverão diminuir o resultado em exercícios futuros.","options":["Legal.","Estatutárias.","Para contingências.","De lucros a realizar.","De lucros para expansão."],"answer":"C","why":"Reserva para contingências separa lucros para compensar redução futura de resultado decorrente de perda provável e estimável.","others":"Legal, estatutária, lucros a realizar e expansão não têm como finalidade principal esse risco extraordinário específico."},{"original":99,"topic":"DIVIDENDOS","prompt":"Os dividendos esperados são fatores determinantes no preço da ação. Representam recursos líquidos para os acionistas e indicam o desempenho atual e futuro da empresa. Nas empresas de capital aberto, o órgão da governança corporativa que estabelece a política de dividendos é:","options":["Conselho de Família;","Comitê de Auditoria;","Conselho Fiscal;","Diretoria Executiva;","Conselho de Administração."],"answer":"E","why":"Conselho de Administração define diretrizes e políticas estratégicas, entre elas a política de dividendos em companhias abertas, conforme a governança descrita.","others":"Conselho de Família não é órgão societário típico; Comitê de Auditoria e Conselho Fiscal fiscalizam; Diretoria Executiva executa a gestão, não substitui a competência de política do conselho no enunciado."}], TAG='moreira_quiz_fgv_2026_v3_'+QUIZ_NUM;
const app=document.querySelector('#app'), footer=document.querySelector('#footer');
const letters=['A','B','C','D','E'];
let state={screen:'cover',index:0,selected:Array(20).fill(null),confirmed:Array(20).fill(false)};
try{let prior=JSON.parse(localStorage.getItem(TAG)||'null');if(prior&&prior.selected?.length===20&&prior.confirmed?.length===20){state={...state,index:Math.max(0,Math.min(19,prior.index||0)),selected:prior.selected,confirmed:prior.confirmed};}}catch(e){}
function save(){try{localStorage.setItem(TAG,JSON.stringify({index:state.index,selected:state.selected,confirmed:state.confirmed}));}catch(e){}}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asText=s=>escapeHTML(s).replace(/\n/g,'<br>');
const result=()=>({n:state.confirmed.filter(Boolean).length,good:state.confirmed.filter((c,i)=>c&&letters[state.selected[i]]===DATA[i].answer).length});
function mast(head){return `<header class="mast"><div class="brand">CURSO DE CONTABILIDADE <strong>PROFESSOR MOREIRA</strong></div><div class="mastline"><span class="pill">QUESTÕES BÁSICAS DA FGV</span><span class="pill">QUIZ ${QUIZ_NUM} DE 5</span></div></header>`;}
function render(){let view='';if(state.screen==='cover'){let score=result();view=mast()+`<section class="whitecard cover"><div class="eyebrow">Treinamento interativo • FGV</div><h1>Questões Básicas da FGV</h1><div class="lede">20 questões de Contabilidade Geral, abrangendo 20 assuntos diferentes. Responda, confirme e veja a correção detalhada imediatamente abaixo.</div><div class="highlights"><div class="hl"><b>20</b><span>QUESTÕES</span></div><div class="hl"><b>20</b><span>ASSUNTOS</span></div><div class="hl"><b>${score.n}</b><span>JÁ RESPONDIDAS</span></div></div><button class="primary big-btn" data-act="start">${score.n?'▶ Continuar de onde parou':'▶ Começar o Quiz '+QUIZ_NUM}</button><p class="small">Sem senha e sem trava. Funciona sem internet depois de salvo. Seu progresso fica neste navegador.</p>${score.n?'<button class="minibtn" data-act="reset">Reiniciar todas as respostas</button>':''}</section>`;footer.hidden=true;}
else if(state.screen==='results'){let s=result(),pct=Math.round(s.good/20*100),miss=s.n-s.good;view=mast()+`<section class="whitecard results"><div class="eyebrow">Relatório do aluno — Quiz ${QUIZ_NUM}</div><h2>Resultado do treinamento</h2><div class="score">${pct}%</div><div class="scoresub">${s.good} acertos em 20 questões • pontuação de 0 a 100%</div><div class="metrics"><div class="metric"><strong>${s.good}</strong><span>ACERTOS</span></div><div class="metric"><strong>${miss}</strong><span>ERROS</span></div><div class="metric"><strong>${20-s.n}</strong><span>NÃO RESPONDIDAS</span></div></div><p>${s.good===20?'Excelente! Você acertou todas as questões.':s.good>=15?'Bom desempenho. Revise especialmente os erros comentados.':'Revise as explicações e refaça as questões com atenção aos conceitos.'}</p><div class="result-actions"><button class="primary" data-act="review">↩ Rever as questões</button><button class="outline" data-act="cover">⌂ Voltar à capa</button><button class="danger" data-act="reset">⟳ Reiniciar Quiz ${QUIZ_NUM}</button></div><h3>Revisão por assunto</h3><div class="review">${DATA.map((q,i)=>{let status=state.confirmed[i]?(letters[state.selected[i]]===q.answer?'ok':'bad'):'skip';return `<button data-act="jump" data-index="${i}"><span><strong>${String(i+1).padStart(2,'0')}.</strong> ${escapeHTML(q.topic)}</span><span class="rmark ${status}">${status==='ok'?'✓':status==='bad'?'✕':'—'}</span></button>`}).join('')}</div></section>`;footer.hidden=true;}
else{let i=state.index,q=DATA[i],done=state.confirmed[i],chosen=state.selected[i],correctIdx=letters.indexOf(q.answer),pass=done&&chosen===correctIdx,s=result();view=mast()+`<section class="whitecard"><div class="questiontop"><span>QUESTÃO ${i+1} DE 20</span><span>${s.n} respondidas</span></div><div class="bar" role="progressbar" aria-valuenow="${s.n}" aria-valuemax="20"><div style="width:${s.n/20*100}%"></div></div><span class="topic">${escapeHTML(q.topic)}</span><h2 class="qtitle">${asText(q.prompt)}</h2><div class="answers" role="radiogroup" aria-label="Selecione uma alternativa">${q.options.map((o,j)=>`<button class="opt ${chosen===j?'selected':''} ${done?(j===correctIdx?'right':(j===chosen?'wrong':'')):''}" data-act="select" data-option="${j}" ${done?'disabled':''} aria-pressed="${chosen===j}"><span class="letter">${letters[j]}</span><span>${asText(o)}</span></button>`).join('')}</div><div class="tools">${!done?`<button class="primary" data-act="confirm" ${chosen==null?'disabled':''}>✓ Confirmar resposta</button>`:`<button class="subtle" data-act="redo">↺ Refazer esta questão</button>`}</div>${done?`<article class="feedback ${pass?'':'fail'}" id="correcao"><div class="fhead"><span class="status-icon">${pass?'✓':'✕'}</span>${pass?'Você acertou! Luz verde.':'Você errou. Luz vermelha.'}</div><div class="fbcontent"><div class="gabarito">GABARITO DA COLETÂNEA: ALTERNATIVA ${q.answer} — ${escapeHTML(q.options[correctIdx])}</div><h3>Por que essa alternativa está correta?</h3><p>${asText(q.why)}</p><h3>Por que as outras alternativas estão incorretas?</h3><p>${asText(q.others)}</p><div class="sourcehint">Correção didática elaborada a partir das questões e do gabarito da coletânea fornecida. Quando há ressalvas, elas aparecem no comentário.</div></div></article>`:''}</section>`;
footer.hidden=false;footer.innerHTML=`<div class="navin"><button class="outline" data-act="prev" ${i===0?'disabled':''}>← Voltar</button><button class="primary" data-act="next">${i===19?'Finalizar ✓':'Avançar →'}</button><button class="subtle" data-act="reset" title="Reiniciar as 20 questões" aria-label="Reiniciar quiz">⟳</button></div>`;}
app.innerHTML=view;}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
function flash(success){let el=document.querySelector('#flash');el.className='flash '+(success?'':'error')+' show';document.querySelector('#flashmsg').textContent=success?'✓ ACERTOU!':'✕ ERROU!';window.clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove('show'),900);}
function reset(){if(confirm('Reiniciar este quiz? Isso apagará as respostas salvas das 20 questões.')){state.index=0;state.selected=Array(20).fill(null);state.confirmed=Array(20).fill(false);state.screen='cover';save();render();scrollTop();}}
function nav(i){state.index=Math.min(19,Math.max(0,i));state.screen='question';save();render();scrollTop();}
document.addEventListener('click',e=>{let btn=e.target.closest('button[data-act]');if(!btn)return;let cmd=btn.dataset.act;if(cmd==='start'){nav(state.index);}
else if(cmd==='select'){if(!state.confirmed[state.index]){state.selected[state.index]=Number(btn.dataset.option);save();render();}}
else if(cmd==='confirm'){let i=state.index,q=DATA[i];if(state.selected[i]==null||state.confirmed[i])return;state.confirmed[i]=true;save();render();flash(letters[state.selected[i]]===q.answer);setTimeout(()=>document.querySelector('#correcao')?.scrollIntoView({block:'start',behavior:'smooth'}),90);}
else if(cmd==='redo'){state.confirmed[state.index]=false;state.selected[state.index]=null;save();render();}
else if(cmd==='prev'){nav(state.index-1);}
else if(cmd==='next'){state.index===19?(state.screen='results',save(),render(),scrollTop()):nav(state.index+1);}
else if(cmd==='reset'){reset();}
else if(cmd==='review'){nav(0);}
else if(cmd==='jump'){nav(Number(btn.dataset.index));}
else if(cmd==='cover'){state.screen='cover';save();render();scrollTop();}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&state.screen==='question'&&!e.altKey&&!e.ctrlKey){if(state.index===19){state.screen='results';render();scrollTop();}else nav(state.index+1);}if(e.key==='ArrowLeft'&&state.screen==='question'&&!e.altKey&&!e.ctrlKey&&state.index>0)nav(state.index-1);});
render();
</script></body></html>
